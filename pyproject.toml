[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "motile-tracker"
dynamic = ["version"]
description = "Application for interactive tracking with global optimization"
readme = "README.md"
license = { text = "BSD 3-Clause License" }
requires-python = ">=3.11"
authors = [
    { name = "Caroline Malin-Mayor", email = "malinmayorc@janelia.hhmi.org" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies =[
    "napari>=0.6.2,<0.8.0",
    "funtracks>=2.1.0-a3,<3",
    "appdirs>=1,<2",
    "numpy>=2,<3",
    "magicgui>=0.10.1",
    "qtpy>=2.4,<3",
    "scikit-image>=0.25",
    "motile>=1.0,<2",
    "pydantic>=2,<3",
    "tifffile[all]>=2025.1.10",
    "tqdm>=4,<5",
    "dask[array]>=2021.10.0",
    "fonticon-fontawesome6>=6,<7",
    "pyqtgraph>=0.13,<1",
    "fastplotlib>=0.6.1,<0.7",
    "pygfx==0.15.3",
    "wgpu>=0.29, <0.30",
    "napari-orthogonal-views>=0.4.0",
    "lxml_html_clean>=0.4,<1",
    "zarr>=2.18.7,<4",
    # Not used directly (it arrives via tracksdata), pinned to keep it co-installable
    # with pygfx's uharfbuzz. Both are Cython 3.3.0 limited-API builds that share the
    # runtime module _cython_3_3_0limitednofinalize, but at different Py_LIMITED_API
    # levels (blosc2 >= 4.12 is cp311-abi3, uharfbuzz is cp310-abi3), where
    # cython_function_or_method has a different struct size. Whichever imports second
    # dies with "Shared Cython type cython_function_or_method has the wrong size".
    # motile_tracker is the only place these two meet, so the pin belongs here.
    # Drop it once Cython encodes the limited-API level in that module name, or once
    # the two agree on a level.
    "blosc2>=4.11,<4.12",
]

[project.optional-dependencies]
numba = ["numba>=0.62.1"]
gurobi = ["gurobipy"]
gurobi12 = ["gurobipy>=12,<13"]
gurobi13 = ["gurobipy>=13,<14"]
all = [
    "pyqt6>=6.7,<7",
]

[project.entry-points."napari.manifest"]
motile-tracker = "motile_tracker:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/funkelab/motile_tracker/issues"
"Documentation" ="https://funkelab.github.io/motile_tracker/"

[project.scripts]
motile_tracker = "motile_tracker.__main__:main"

[dependency-groups]
testing =[
    "pyqt6>=6.7,<7",
    "pytest>=8.3,<9",
    "pytest-cov>=6",
    "pytest-qt>=4.4,<5",
    "pytest-benchmark>=5,<6",
]
docs = [
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
    "sphinx-autoapi>=3,<4",
    "sphinx_rtd_theme>=3,<4",
    "sphinxcontrib-video>=0.4.1",
]
dev = [
    "ruff>=0.13",
    "pre-commit>=4,<5",
    "numba>=0.62.1",
    {include-group="testing"},
    {include-group = "docs"},
]
# For gurobi, install separately: uv pip install "gurobipy>=12,<13"

[tool.uv.sources]
# Unreleased funtracks, for tracksdata >= 0.1.0rc9: that release swapped spatial-graph
# for rstar-python. spatial-graph's prebuilt rtree is a Cython limited-API build that
# collides with pygfx's uharfbuzz over the shared _cython_3_3_0limitednofinalize module
# ("Shared Cython type cython_function_or_method has the wrong size"), which broke GEFF
# import in the tree view. rstar-python is Rust, so there is nothing to collide with.
# Drop this source once a funtracks release includes the commit.
funtracks = { git = "https://github.com/funkelab/funtracks.git", rev = "d9d83ea23c273e880b5b82cdc8343235d8e9e9eb" }

[tool.uv]
# gurobi12 and gurobi13 conflict with each other (mutually exclusive version pins)
conflicts = [
    [
        {extra = "gurobi12"},
        {extra = "gurobi13"},
    ],
]

[tool.pytest.ini_options]
# Benchmarks are slow and run in a dedicated CI job; exclude them from the normal
# test suite (`just test` / `pytest .`). Run with `pytest tests/benchmarks -o addopts=`.
addopts = "--ignore=tests/benchmarks"
# Benchmark modules are named bench_*.py; collect those in addition to test_*.py so
# that pointing pytest at the tests/benchmarks directory discovers them.
python_files = ["test_*.py", "bench_*.py"]
filterwarnings = [
    # Temporarily disabled: motile_tracker still converts to the deprecated
    # SolutionTracks when emitting tracks, because the views/actions require
    # track IDs. Re-add when we refactor to operate on Tracks directly, ahead
    # of the next major funtracks release.
    # "error::DeprecationWarning:funtracks",
]

[tool.setuptools_scm]
write_to = "src/motile_tracker/_version.py"

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "ISC001", # implicit string concatenation
    "E501", # line too long
]

unfixable = [
  "B905", # currently adds strict=False to zips. Should add strict=True (manually)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["F"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]

[tool.mypy]
ignore_missing_imports = true
