name: tests

on:
  push:
    branches: [main]
    tags: ["v*"] # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ${{ matrix.platform }}
    # Healthy runs finish in 5-12 minutes; without this a hang (e.g. a wgpu/tree-widget
    # deadlock) burns the full 360-minute default before GitHub cancels it.
    timeout-minutes: 30
    env:
      # disable resyncing on uv run
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      # OS-specific bugs are almost always Qt/GL-driver related and Python-version-
      # agnostic, while version-specific bugs are language/stdlib related and OS-
      # agnostic -- the two axes rarely interact, so we don't need their full cross:
      #   - lowest-direct (oldest allowed deps) on all platforms, but only at our
      #     floor Python (3.11, see requires-python) -- those dependency versions
      #     predate 3.12/3.13 anyway, so testing them there too is redundant.
      #   - highest deps on all platforms, but only at our newest Python (3.13).
      #   - the remaining Python version (3.12) only on ubuntu (cheapest runner), as
      #     a spot-check rather than a full platform cross.
      matrix:
        include:
          - platform: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
          - platform: macos-latest
            python-version: "3.11"
            resolution: lowest-direct
          - platform: windows-latest
            python-version: "3.11"
            resolution: lowest-direct
          - platform: ubuntu-latest
            python-version: "3.12"
            resolution: highest
          - platform: ubuntu-latest
            python-version: "3.13"
            resolution: highest
          - platform: macos-latest
            python-version: "3.13"
            resolution: highest
          - platform: windows-latest
            python-version: "3.13"
            resolution: highest

    steps:
      - uses: actions/checkout@v7
      # The Ubuntu runner image ships broken Microsoft apt repos whose signature
      # is periodically invalid ("Clearsigned file isn't valid, got 'NOSPLIT'"),
      # which fails the apt-get update inside setup-qt-libs. We don't need them.
      - name: Remove broken Microsoft apt sources (ubuntu runner image)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
      - uses: tlambert03/setup-qt-libs@v1

      # wgpu (via pygfx/fastplotlib, used by the tree view) needs a real Vulkan/GL
      # adapter; Xvfb (below) only provides X11/GLX, not Vulkan. lavapipe/llvmpipe
      # give it a software one, matching how pygfx/wgpu-py run their own Linux CI.
      - name: Install llvmpipe and lavapipe for offscreen wgpu rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group testing --resolution ${{ matrix.resolution }}

      - name: Set Windows resolution
        if: runner.os == 'Windows'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
        shell: powershell

      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1
          if (Test-Path -Path "C:\Windows\system32\opengl32.dll" -PathType Leaf) {Exit 0} else {Exit 1}
        shell: powershell

      - name: Test
        uses: aganders3/headless-gui@v2
        with:
          run: uv run pytest --color=yes --cov=motile_tracker --cov-report=xml --cov-report=term-missing .

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: funkelab/motile_tracker
